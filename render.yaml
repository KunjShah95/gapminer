services:
  - type: web
    name: gapminer-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd apps/api && npm install && npx prisma generate
    startCommand: cd apps/api && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gapminer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8000

databases:
  - name: gapminer-db
    plan: free
    databaseName: gapminer
    user: gapminer
